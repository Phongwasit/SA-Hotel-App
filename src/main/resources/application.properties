spring.application.name=hotel-frontdesk
server.address=127.0.0.1
server.port=${HOTEL_PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.datasource.url=${HOTEL_DB_URL:jdbc:mysql://127.0.0.1:3307/hotel_frontdesk?connectionTimeZone=%2B07:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${HOTEL_DB_USER:hotel_app}
spring.datasource.password=${HOTEL_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=true
spring.thymeleaf.cache=false
spring.web.resources.cache.period=3600
server.error.include-message=never
server.error.include-stacktrace=never
hotel.bootstrap.enabled=${HOTEL_BOOTSTRAP_ENABLED:false}
