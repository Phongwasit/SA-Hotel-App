<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ข้อมูลผู้พักและผู้รับเอกสาร | Hotel Front Desk</title><link rel="stylesheet" th:href="@{/css/hotel.css(v='20261107-booking-fix')}"><link rel="stylesheet" th:href="@{/css/desk.css(v='20261107-booking-fix')}"><script th:src="@{/js/desk.js}" defer></script><script th:src="@{/js/name-validation.js(v='20261107-names')}" defer></script></head><body class="app-shell"><aside th:replace="~{fragments/shell :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/shell :: topbar}"></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow muted">งานต้อนรับ</span><h1>ข้อมูลผู้พักและผู้รับเอกสาร</h1></div></div><div class="alert alert-success no-print" th:if="${param.saved!=null}">บันทึกข้อมูลเรียบร้อยแล้ว</div>
<div class="button-row no-print"><a class="button button-outline" th:href="@{/profiles(recordType='GUEST')}">ผู้พัก</a><a class="button button-outline" th:href="@{/profiles(recordType='DOCUMENT_RECIPIENT')}">ผู้รับเอกสาร</a><a class="text-link" th:href="@{/check-in}">ไปเช็คอิน →</a></div>
<form class="card desk-pad inline-form" method="get" th:action="@{/profiles}"><input type="hidden" name="recordType" th:value="${recordType}"><div class="field grow"><label for="searchText">ค้นหาชื่อ เบอร์โทร เลขประจำตัว หรือเลขผู้เสียภาษี</label><input id="searchText" name="searchText" th:value="${searchText}"></div><button class="button button-primary" type="submit">ค้นหา</button></form>
<div class="desk-columns"><section class="card"><div class="card-heading"><h2 th:text="${recordType=='GUEST'?'รายชื่อผู้พัก':'รายชื่อผู้รับเอกสาร'}"></h2><span th:text="${profiles.size()}+' รายการ'"></span></div><div class="table-scroll"><table class="room-table compact-table"><thead><tr><th>ชื่อ</th><th>ข้อมูลประกอบ</th><th></th></tr></thead><tbody><tr th:each="p:${profiles}"><td th:text="${recordType=='GUEST'?p.guest_name:p.recipient_name}"></td><td th:text="${recordType=='GUEST'?p.phone:p.tax_id}"></td><td><a class="text-link" th:href="@{/profiles(recordType=${recordType},profileId=${p.profile_id})}">เลือก / แก้ไข</a></td></tr><tr th:if="${profiles.isEmpty()}"><td colspan="3">ไม่พบข้อมูล</td></tr></tbody></table></div></section>
<section class="card desk-pad"><h2 th:text="${profileId==null?'เพิ่มข้อมูลใหม่':'แก้ไขข้อมูล #'+profileId}"></h2><div class="alert alert-error" th:if="${formError!=null}" th:text="${formError}"></div>
<p class="notice" th:if="${recordType=='DOCUMENT_RECIPIENT'}">แก้ไขผู้รับรายนี้แล้ว ทุกห้องและ Folio ที่อ้างถึงจะใช้ข้อมูลล่าสุด ชื่อจำเป็น ส่วนที่อยู่และเลขผู้เสียภาษีเติมระหว่างพักได้</p>
<form class="desk-form" method="post" th:action="@{/profiles/save}" id="profile-form"><input type="hidden" name="recordType" th:value="${recordType}"><input type="hidden" name="profileId" th:value="${profileId}">
<th:block th:if="${recordType=='GUEST'}"><fieldset class="guest-title"><legend>คำนำหน้าชื่อ</legend><div class="guest-title-options"><label><input type="radio" name="title" value="" th:checked="${input['title']==null or input['title']==''}"> ไม่ระบุ</label><label><input type="radio" name="title" value="นาย" th:checked="${input['title']=='นาย'}"> นาย</label><label><input type="radio" name="title" value="นาง" th:checked="${input['title']=='นาง'}"> นาง</label><label><input type="radio" name="title" value="นางสาว" th:checked="${input['title']=='นางสาว'}"> นางสาว</label></div></fieldset><div class="field"><label for="firstName">ชื่อ (ไม่รวมคำนำหน้า)</label><input id="firstName" name="firstName" th:attr="pattern=${personNamePattern}" data-name-kind="person" title="ชื่อต้องมีตัวอักษรและไม่มีตัวเลข ใช้เว้นวรรค จุด ขีด หรืออัญประกาศในชื่อได้" th:value="${input['firstName']}" maxlength="100" required></div><div class="field"><label for="lastName">นามสกุล</label><input id="lastName" name="lastName" th:attr="pattern=${personNamePattern}" data-name-kind="person" title="นามสกุลต้องมีตัวอักษรและไม่มีตัวเลข ใช้เว้นวรรค จุด ขีด หรืออัญประกาศในชื่อได้" th:value="${input['lastName']}" maxlength="100" required></div><div class="field"><label for="cardType">ประเภทเอกสารประจำตัว</label><select id="cardType" name="cardType"><option value="NATIONAL_ID" th:selected="${input['cardType']=='NATIONAL_ID'}">บัตรประชาชน</option><option value="PASSPORT" th:selected="${input['cardType']=='PASSPORT'}">หนังสือเดินทาง</option><option value="OTHER" th:selected="${input['cardType']=='OTHER'}">อื่น ๆ</option></select></div><div class="field"><label for="officialId">เลขเอกสารประจำตัว</label><input id="officialId" name="officialId" th:value="${input['officialId']}" maxlength="50" required></div><div class="field"><label for="phone">เบอร์โทร</label><input id="phone" name="phone" th:value="${input['phone']}" maxlength="30"></div></th:block>
<th:block th:if="${recordType=='DOCUMENT_RECIPIENT'}"><div class="field"><label for="recipientType">ประเภทผู้รับ</label><select id="recipientType" name="recipientType"><option value="PERSON" th:selected="${input['recipientType']=='PERSON'}">บุคคล</option><option value="ORGANIZATION" th:selected="${input['recipientType']=='ORGANIZATION'}">หน่วยงาน</option></select></div><div class="field"><label for="recipientName">ชื่อผู้รับ / ชื่อหน่วยงาน</label><input id="recipientName" name="recipientName" th:attr="pattern=${organizationNamePattern},data-person-pattern=${personNamePattern},data-organization-pattern=${organizationNamePattern}" data-name-kind="recipient" title="ชื่อผู้รับหรือหน่วยงานต้องมีตัวอักษร ไม่ใช่ตัวเลขหรือสัญลักษณ์ล้วน" th:value="${input['recipientName']}" maxlength="255" required></div><div class="field"><label for="taxId">เลขผู้เสียภาษี (หน่วยงานต้องกรอกก่อนออกเอกสาร)</label><input id="taxId" name="taxId" th:value="${input['taxId']}" maxlength="30"></div><div class="field"><label for="address">ที่อยู่</label><textarea id="address" name="address" maxlength="2000" rows="3" th:text="${input['address']}"></textarea></div></th:block>
<div class="button-row"><button class="button button-primary" type="submit">บันทึกข้อมูล</button><a class="text-link" th:href="@{/profiles(recordType=${recordType})}">เพิ่มรายใหม่</a></div></form></section></div></main><footer th:replace="~{fragments/shell :: footer}"></footer></div></body></html>
