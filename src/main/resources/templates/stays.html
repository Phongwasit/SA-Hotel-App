<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายการเข้าพัก | Hotel Front Desk</title><link rel="stylesheet" th:href="@{/css/hotel.css(v='20261106-font')}"><link rel="stylesheet" th:href="@{/css/desk.css(v='20261106-font')}"><script th:src="@{/js/desk.js}" defer></script></head><body class="app-shell"><aside th:replace="~{fragments/shell :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/shell :: topbar}"></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow muted">งานต้อนรับ</span><h1>รายการเข้าพัก</h1></div></div><div class="alert alert-success no-print" th:if="${param.saved!=null}">บันทึกข้อมูลเรียบร้อยแล้ว</div>
<form class="card desk-pad inline-form" th:action="@{/stays}" method="get"><div class="field grow"><label for="searchText">ค้นหาเลขห้อง รหัสการพัก หรือชื่อผู้พัก</label><input id="searchText" name="searchText" th:value="${searchText}"></div><button type="submit" class="button button-primary">ค้นหา</button><a class="button button-outline" th:href="@{/check-in}">เช็คอินใหม่</a></form>
<section class="card"><div class="table-scroll"><table class="room-table"><thead><tr><th>รหัส / ห้อง</th><th>ผู้พัก</th><th>คืนเริ่มพัก → วันออก</th><th>ยอดค้าง</th><th>สถานะ</th><th></th></tr></thead><tbody><tr th:each="a:${accounts}"><td th:text="'#'+${a.id()}+' · '+${a.stay.room_number}"></td><td th:text="${a.stay.guest_name}"></td><td th:text="${a.stay.check_in_date}+' → '+${a.stay.expected_check_out_date}"></td><td th:text="${a.balance()}+' บาท'"></td><td th:text="${a.active()?'กำลังพัก':'เช็คเอาต์แล้ว'}"></td><td><a class="text-link" th:href="@{/stays/{id}(id=${a.id()})}">เปิดรายละเอียด</a></td></tr><tr th:if="${accounts.isEmpty()}"><td colspan="6">ไม่พบรายการเข้าพัก</td></tr></tbody></table></div></section></main><footer th:replace="~{fragments/shell :: footer}"></footer></div></body></html>
