<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สถานะห้อง | Hotel Front Desk</title><link rel="stylesheet" th:href="@{/css/hotel.css}"><link rel="stylesheet" th:href="@{/css/desk.css}"><script th:src="@{/js/desk.js}" defer></script></head><body class="app-shell"><aside th:replace="~{fragments/shell :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/shell :: topbar}"></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow muted">งานต้อนรับ</span><h1>สถานะห้อง</h1></div></div><div class="alert alert-success no-print" th:if="${param.saved!=null}">บันทึกข้อมูลเรียบร้อยแล้ว</div>
<p class="notice">พนักงานต้อนรับบันทึกตามที่แม่บ้านหรือช่างแจ้ง หากเป็นระบบน้ำ ไฟ แอร์ หรือสิ่งจำเป็นเสีย ให้พิจารณางดใช้ห้อง สถานะมีผู้พักเปลี่ยนผ่านเช็คอินและเช็คเอาต์เท่านั้น</p>
<section class="card desk-pad" th:if="${selectedRoom!=null}"><h2 th:text="'ปรับสภาพห้อง '+${selectedRoom.roomNumber}"></h2><p class="muted" th:text="${selectedRoom.occupancyLabel()}"></p><form method="post" th:action="@{/room-status/save}" class="desk-form" id="room-status-form"><input type="hidden" name="roomId" th:value="${selectedRoom.roomId}"><div class="grid-three desk-form"><div class="field"><label for="cleanliness">ความสะอาด</label><select id="cleanliness" name="cleanliness"><option value="CLEAN" th:selected="${selectedRoom.cleanliness=='CLEAN'}">สะอาด</option><option value="DIRTY" th:selected="${selectedRoom.cleanliness=='DIRTY'}">รอทำความสะอาด</option></select></div><div class="field"><label for="usability">การใช้งาน</label><select id="usability" name="usability"><option value="USABLE" th:selected="${selectedRoom.usability=='USABLE'}">ใช้งานได้</option><option value="OUT_OF_ORDER" th:selected="${selectedRoom.usability=='OUT_OF_ORDER'}">งดใช้ / รอซ่อม</option></select></div><div class="field"><label for="reason">เหตุผล / ผลที่ได้รับแจ้ง</label><input id="reason" name="reason" th:value="${selectedRoom.conditionReason}" maxlength="500" required></div></div><button class="button button-primary" type="submit" id="save-room-status">บันทึกสภาพห้อง</button></form></section>
<section class="card"><div class="card-heading"><h2>ห้องทั้งหมด 41 ห้อง</h2><span class="muted small">ว่าง + สะอาด + ใช้งานได้ = พร้อมเข้าพักขณะนี้</span></div><div class="room-state-grid"><a class="room-state-card" th:each="r:${rooms}" th:href="@{/room-status(roomId=${r.roomId})}" th:classappend="${r.usability=='OUT_OF_ORDER'?'room-blocked':(r.occupancy=='OCCUPIED'?'room-occupied':(r.cleanliness=='DIRTY'?'room-dirty':'room-ready'))}"><strong th:text="${r.roomNumber}"></strong><span th:text="${r.roomType}"></span><span th:text="${r.occupancyLabel()}"></span><span th:text="${r.cleanlinessLabel()}"></span><span th:text="${r.usability=='USABLE'?'ใช้งานได้':'งดใช้ / รอซ่อม'}"></span><small th:text="${r.conditionReason}"></small></a></div></section></main><footer th:replace="~{fragments/shell :: footer}"></footer></div></body></html>
