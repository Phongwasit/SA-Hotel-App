<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายละเอียดการรับเงิน | Hotel Front Desk</title><link rel="stylesheet" th:href="@{/css/hotel.css}"><link rel="stylesheet" th:href="@{/css/desk.css}"><script th:src="@{/js/desk.js}" defer></script></head><body class="app-shell"><aside th:replace="~{fragments/shell :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/shell :: topbar}"></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow muted">งานต้อนรับ</span><h1>รายละเอียดการรับเงิน</h1></div></div><div class="alert alert-success no-print" th:if="${param.saved!=null}">บันทึกข้อมูลเรียบร้อยแล้ว</div>
<div class="alert alert-success">บันทึกเงินรับเรียบร้อยแล้ว</div><section class="card desk-pad"><h2 th:text="'เงินรับ #'+${payment.payment_id}"></h2><div class="summary-grid"><div><span>เวลารับเงินจริง</span><strong th:text="${payment.received_at}"></strong></div><div><span>ผู้รับเงิน</span><strong th:text="${payment.first_name+' '+payment.last_name}"></strong></div><div><span>รวม</span><strong th:text="${total}+' บาท'"></strong></div></div><p th:text="${payment.evidence}"></p><p th:each="m:${methods}" th:text="${m.method=='CASH'?'เงินสด':(m.method=='TRANSFER'?'โอน':'บัตร')}+' '+${m.amount}+' บาท'"></p></section><section class="card"><div class="table-scroll"><table class="room-table"><thead><tr><th>ห้อง / การพัก</th><th>คืนวันที่</th><th>จำนวนเงิน</th><th>วิธีชำระ</th></tr></thead><tbody><tr th:each="a:${allocations}"><td><a class="text-link" th:href="@{/stays/{id}(id=${a.stay_id})}" th:text="${a.room_number}+' · #'+${a.stay_id}"></a></td><td th:text="${a.charge_date}"></td><td th:text="${a.amount}+' บาท'"></td><td th:text="${a.method=='CASH'?'เงินสด':(a.method=='TRANSFER'?'โอน':'บัตร')}"></td></tr></tbody></table></div></section><p class="notice">รายการนี้เป็นข้อมูลรับเงิน ใบเสร็จทางการยังเขียนด้วยมือและบันทึกอ้างอิงในหน้าเอกสารหลังชำระครบ</p><a class="button button-primary" th:href="@{/documents}">ไปจัดเตรียมเอกสาร</a> <a class="text-link" th:href="@{/payments}">รับเงินรายการอื่น</a></main><footer th:replace="~{fragments/shell :: footer}"></footer></div></body></html>
