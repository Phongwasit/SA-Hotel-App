<!doctype html><html lang="th" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายงานการเข้าพัก | Hotel Front Desk</title><link rel="stylesheet" th:href="@{/css/hotel.css}"><link rel="stylesheet" th:href="@{/css/desk.css}"><script th:src="@{/js/desk.js}" defer></script></head><body class="app-shell"><aside th:replace="~{fragments/shell :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments/shell :: topbar}"></header><main class="page-content"><div class="page-heading"><div><span class="eyebrow muted">งานต้อนรับ</span><h1>รายงานการเข้าพัก</h1></div></div><div class="alert alert-success no-print" th:if="${param.saved!=null}">บันทึกข้อมูลเรียบร้อยแล้ว</div>
<form class="card desk-pad report-criteria no-print" method="get" th:action="@{/reports/stays}"><input type="hidden" name="generate" value="true"><div class="desk-form grid-three"><div class="field"><label for="reportType">ประเภทรายงาน</label><select id="reportType" name="reportType"><option value="IN_HOUSE" th:selected="${reportType=='IN_HOUSE'}">ผู้พัก ณ เวลาที่ระบุ (In-house)</option><option value="ARRIVAL" th:selected="${reportType=='ARRIVAL'}">ผู้เข้าพักจริง (Arrival)</option><option value="EXPECTED_DEPARTURE" th:selected="${reportType=='EXPECTED_DEPARTURE'}">คาดว่าจะออก (Expected Departure)</option></select></div><div class="field" id="report-date-field"><label for="reportDate">วันที่รายงาน</label><input id="reportDate" name="reportDate" type="date" th:value="${reportDate}"></div><div class="field" id="report-asof-field"><label for="asOf">เวลาอ้างอิง In-house</label><input id="asOf" name="asOf" type="datetime-local" step="1" th:value="${asOf}"></div></div><button class="button button-primary" type="submit" id="generate-stay-report">สร้างรายงานล่าสุด</button></form>
<section class="card desk-pad report-output" th:if="${reportReady==true}" id="stay-report-preview"><div class="page-heading"><div><h2 th:text="${criteria}"></h2><p class="muted small" th:text="'สร้างเมื่อ '+${generatedAt}+' (เวลาไทย)'"></p></div><button type="button" class="button button-primary no-print" data-print>พิมพ์รายงาน</button></div><p th:text="'จำนวนการเข้าพักรายห้อง '+${reportRows.size()}+' รายการ'"></p><div class="table-scroll"><table class="room-table"><thead><tr><th>ห้อง / รหัส</th><th>ผู้พักหลัก</th><th>คืนเริ่มพัก → วันออก</th><th>เข้าจริง</th><th>ออกจริง</th><th>ประเภท</th></tr></thead><tbody><tr th:each="r:${reportRows}"><td th:text="${r.room_number}+' / #'+${r.stay_id}"></td><td th:text="${r.first_name+' '+r.last_name}"></td><td th:text="${r.check_in_date}+' → '+${r.expected_check_out_date}"></td><td th:text="${r.actual_check_in}"></td><td th:text="${r.actual_check_out}"></td><td th:text="${r.arrival_type=='WALK_IN'?'Walk-in':'จองล่วงหน้า'}"></td></tr><tr th:if="${reportRows.isEmpty()}"><td colspan="6">ไม่พบการเข้าพักตามเงื่อนไข</td></tr></tbody></table></div><p class="muted small">นับการเข้าพักรายห้อง ไม่ใช่จำนวนผู้พักทั้งหมด</p></section></main><footer th:replace="~{fragments/shell :: footer}"></footer></div></body></html>
